[project]
name = "healthycropping-api"
version = "0.1.0"
description = "FastAPI backend for HealthyCropping (auth, offline sync, Cloudinary signing, and Gemini RAG explanations)."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Keylor Pineda", email = "keylorpineda729@gmail.com" },
]
dependencies = [
    "fastapi>=0.115.0",
    "firebase-admin>=6.6.0",
    "google-cloud-firestore>=2.19.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthycropping_api"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
