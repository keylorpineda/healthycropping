# Official agronomic sources for RAG explanations (#35, #73).
#
# Documents are downloaded at build time by `scripts/fetch_agronomic_docs.py` into
# the git-ignored `api/.cache/rag/` directory and are never committed.
#
# Each section is one citable unit:
# - `heading`: the section title as printed in the document's table of contents
#   (used in citations).
# - `pages`: 1-based PDF page range (not the page numbers printed in the document).
# - `start` / `end` (optional): phrases that mark where the section text starts and
#   where the next section starts, matched case- and accent-insensitively. Use
#   them when a page holds more than one section.
# - `disease_classes`: classes of that crop's on-device model
#   (`app/src/ml/models/<crop>/registry.json`) the section explains. When the PDF
#   layout interleaves two sections so their text cannot be separated reliably,
#   the section is tagged with both classes instead of guessing.
#
# Source options: `drop_lines` (regexes for running headers and page numbers) and
# `soft_hyphens` (remove line-break hyphens before a lowercase continuation).

[[sources]]
id = "icafe-guia-tecnica-2020"
crop = "coffee"
title = "Guía técnica para el cultivo de café"
publisher = "Instituto del Café de Costa Rica (ICAFE), Centro de Investigaciones en Café (CICAFE)"
year = 2020
language = "es"
url = "https://www.icafe.cr/wp-content/uploads/cicafe/documentos/GUIA-TECNICA.pdf"
sha256 = "3e3ffbfcd5faa848ab63fbf2c1a544c6cb20372b6dd124f4371c7f60201d3872"
# Running header and printed page number repeated on every page.
drop_lines = ['^GU[IÍ]A T[EÉ]CNICA PARA EL CULTIVO DE CAF[EÉ]\d*$', '^\d{1,3}$']

[[sources.sections]]
# Both pests share page 50 and their control paragraphs are interleaved in the
# two-column layout.
heading = "Minador de la hoja; Arañita roja"
disease_classes = ["leaf_miner", "red_spider_mite"]
pages = [52, 52]

[[sources.sections]]
heading = "Roya del Café"
disease_classes = ["leaf_rust"]
pages = [55, 56]

[[sources.sections]]
# Chasparria is the Costa Rican name for Cercospora coffeicola leaf spot.
heading = "Chasparria"
disease_classes = ["cercospora"]
pages = [63, 63]

[[sources.sections]]
# Derrite is caused by Phoma spp.; the BRACOL "brown leaf spot" label maps to
# Phoma (ml/configs/coffee.yaml).
heading = "Derrite"
disease_classes = ["brown_leaf_spot"]
pages = [65, 65]

[[sources]]
id = "catie-cacao-enfermedades-2021"
crop = "cacao"
title = "Guía para el manejo integrado de enfermedades en el cultivo de cacao (Manual técnico no. 146)"
publisher = "Centro Agronómico Tropical de Investigación y Enseñanza (CATIE)"
year = 2021
language = "es"
url = "https://repositorio.catie.ac.cr/bitstream/handle/11554/10918/Proyecto_Chocolate4all_Gu%C3%ADa_para_el_manejo_integrado_de_enfermedades_en_el_cultivo_de_cacao.pdf?sequence=1&isAllowed=y"
sha256 = "7646479b5109ffa154eabbc41288832b5d7d3513285f1ff9e204f6ad8ae6f7a5"
drop_lines = ['^Gu[ií]a para el manejo integrado de$', '^enfermedades en el cultivo de cacao$', '^\d{1,3}$']
# Words are split across lines with a hyphen ("ge-" / "neral").
soft_hyphens = true

[[sources.sections]]
heading = "Moniliasis: síntomas y ciclo de vida"
disease_classes = ["monilia"]
pages = [7, 12]
start = "Moniliasis Síntomas"

[[sources.sections]]
heading = "Mazorca negra: síntomas y ciclo de vida"
disease_classes = ["black_pod"]
pages = [13, 17]
# Page 17 continues with a different disease (witches' broom), not a model class.
end = "Escoba de bruja"

[[sources.sections]]
# Integrated management written for both fruit diseases together.
heading = "Manejo integrado de plagas"
disease_classes = ["monilia", "black_pod"]
pages = [20, 26]

