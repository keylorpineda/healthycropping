[project]
name = "healthycrop-ml"
version = "0.1.0"
description = "Machine learning data preparation, training, evaluation, and TFLite export pipeline for HealthyCrop."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Keylor Pineda", email = "keylorpineda729@gmail.com" },
]
dependencies = [
    "httpx>=0.28.0",
    "imagehash>=4.3.1",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.5.0",
    "tensorflow>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthycrop_ml"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "imagehash.*",
    "keras.*",
    "tensorflow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
