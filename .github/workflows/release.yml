name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK and accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "${SDK_ROOT}/cmdline-tools/latest/bin" ]; then
            yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run prebuild & assemble release APK (when Android native project is configured)
        working-directory: app
        env:
          CI: "1"
        run: |
          if [ -f "app.json" ] || [ -f "app.config.ts" ]; then
            if [ "${GITHUB_REF_NAME}" = "v1.0.0" ]; then
              # Fail prebuild if any registered TFLite model is missing (app/plugins/withTfliteModels.js)
              export HEALTHYCROPPING_REQUIRE_MODELS=1
            fi
            pnpm exec expo prebuild --platform android --no-install
            if [ -d "android" ] && [ "${GITHUB_REF_NAME}" = "v1.0.0" ]; then
              cd android
              ./gradlew assembleRelease -x lint -x test --no-daemon
              cp app/build/outputs/apk/release/*.apk "../../healthycropping-${GITHUB_REF_NAME}.apk"
            else
              echo "Intermediate pre-1.0 milestone (${GITHUB_REF_NAME}); native prebuild verified."
            fi
          else
            echo "Expo app configuration not yet initialized; skipping APK assembly."
          fi

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME} of HealthyCropping." > release_notes.md
          fi

      - name: Create GitHub Release with APK and TFLite models
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            healthycropping-*.apk
            ml/models/**/*.tflite
            ml/models/**/registry.json
